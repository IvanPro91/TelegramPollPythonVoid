{% load static %}
<nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <div class="flex-shrink-0 flex items-center">
                    <div class="logo-python mx-2 w-8 h-8 rounded-full flex items-center justify-center">
                        <img alt="dots icon" class="icon" src="{% static 'icons/python-svgrepo-com.svg' %}">
                    </div>
                    <h1 class="font-bold text-center">
                        <span class="text-[#3D4F52]">Python Викторина</span>
                    </h1>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-8">
                <a class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium href-profile">Профиль</a>
                <a class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium" href="{% url 'home:home' %}">Викторина</a>
            </div>
            <div class="md:hidden flex items-center">
                <button class="text-gray-500 hover:text-gray-900 focus:outline-none" id="mobile-menu-button">
                    Меню
                </button>
            </div>
        </div>
    </div>

    <div class="mobile-menu hidden md:hidden bg-white shadow-lg" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a class="block px-3 py-2 text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50 href-profile">Профиль</a>
            <a class="block px-3 py-2 text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50"
               href="{% url 'home:home' %}">Викторина</a>
        </div>
    </div>
</nav>

<script>

    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    mobileMenuButton.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();

            if (!mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.add('hidden');
            }

            document.querySelector(this.getAttribute('href')).scrollIntoView({
                behavior: 'smooth'
            });
        });
    });

</script>
