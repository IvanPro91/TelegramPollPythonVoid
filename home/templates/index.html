{% extends 'base/base_template.html' %}

{% block title %}Викторина{% endblock %}
{% block content %}

<section class="bg-gray-50 rounded-xl p-6 border border-gray-200">
    <h3 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Проверьте свои знания</h3>
    <form class="space-y-8" id="quiz-form">
        <div class="p-5 bg-white rounded-lg border border-gray-200 shadow-sm">
            <h4 class="text-xl font-medium text-gray-800 mb-4">Вопрос {{ poll.id_poll }}: {{ poll.quest }}</h4>
            <div class="space-y-3">
                {% for answer in poll.answers %}
                    <label class="quiz-option flex items-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <input class="h-5 w-5 text-indigo-600 mr-3" name="question" type="radio" value="a">
                        <span> {{ answer }}</span>
                    </label>
                {% endfor %}
            </div>
        </div>

        <div class="text-center pt-4">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-medium text-lg transition duration-300 shadow-md hover:shadow-lg"
                    type="submit">
                Проверить ответы
            </button>
        </div>
    </form>
</section>

{% endblock %}
