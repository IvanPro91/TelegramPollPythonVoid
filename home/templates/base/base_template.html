<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Урок по основам работы с переменными в Python для начинающих программистов" name="description">
    <meta content="Python, переменные, программирование, уроки Python, изучение Python, основы Python" name="keywords">
    <title>{% block title %}{% endblock %}</title>
    <script src="{% static 'js/twain.js' %}"></script>
    <link href="{% static 'css/Font Awesome.css' %}" rel="stylesheet">
    <link href="{% static 'css/default.min.css' %}" rel="stylesheet">
    <script src="{% static 'js/highlight.min.js' %}"></script>
    <script src="{% static 'js/python.min.js' %}"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>hljs.highlightAll();</script>
    <style>

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #293436;
            min-height: 100vh;
        }

        .logo-python {
            position: relative;
        }

        .logo-python::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(246, 195, 44, 0.3) 0%, rgba(254, 255, 255, 0) 70%);
            border-radius: 50%;
        }

        .option:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            transition: width 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        .code-editor {
            font-family: 'Courier New', monospace;
            background-color: #f3f3f3;
            padding: 1rem;
            border-radius: 0.5rem;
            tab-size: 4;
        }

        .code-keyword {
            color: #c678dd;
        }

        .code-function {
            color: #61afef;
        }

        .code-string {
            color: #98c379;
        }

        .code-comment {
            color: #5c6370;
            font-style: italic;
        }

        .code-number {
            color: #d19a66;
        }

    </style>

</head>
<body class="text-white">
<div class="container mx-auto px-4 py-8 max-w-4xl">
    {% include 'base/menu.html' %}
    <main>
        {% block content %}{% endblock %}
    </main>
</div>

<div aria-hidden="true" aria-labelledby="staticBackdropLabel" class="modal" data-bs-backdrop="static" data-bs-keyboard="false"
     id="modal_window" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-black" id="modal_text_header">
                Заголовок
            </div>
            <div class="modal-footer">
                <a class="btn-sm btn btn-danger" data-bs-dismiss="modal" id="btn_invalid_poll"
                   type="button">Исправить</a>
                <a class="btn-sm btn btn-success ms-auto" data-bs-dismiss="modal" id="btn_next_poll" type="button">Продолжить</a>
            </div>
        </div>
    </div>
</div>

{% include 'base/footer.html' %}
</body>
<script src="{% static 'js/telegram-web-app.js' %}"></script>
<script>
    let tg = window.Telegram.WebApp;
    let elem_username = $('#name_tg');
    let modal_text_header = $('#modal_text_header');
    let first_name = tg.initDataUnsafe.user.first_name || "";
    let last_name = tg.initDataUnsafe.user.last_name || "";
    let username = tg.initDataUnsafe.user.username || "";
    let user_id = tg.initDataUnsafe.user.id;
    elem_username.text(first_name + " " + last_name + " @" + username);

    $("#btn_next_poll").click(function () {
        location.reload();
    })

    $("#btn_invalid_poll").click(function () {
        alert("Тут отправка на исправление, после закрытия обновление страницы!")
        location.reload();
    })

    $("#btn_coins").click(function () {
        alert("Вы можете поддержать разработчика:\n\nкарта сбербанк 2202200208407435 Иван Анатольевич Д. ")
    })

    function chk_answer(id_poll, index_answer) {
        let current_answer = '{{ poll.current_answer }}'
        if (current_answer === index_answer) {
            modal_text_header.text("Ответ верный! +1 балл");
        } else {
            modal_text_header.html("Ответ не верный! -1 балл<br>{{ poll.hint }}");
        }
        $("#modal_window").modal('show');
        //alert("Отладка: \n" + user_id + "\n" + username + "\n" + id_poll + "\n" + index_answer);
    };
</script>
</html>
